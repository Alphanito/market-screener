name: Refresh market screener data

on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests yfinance

      - name: Run screener
        run: python market_screener.py

      - name: Commit updated data
        run: |
          git config user.name "market-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add screener_data.js
          git diff --quiet --cached || git commit -m "Refresh screener data"
          git push
