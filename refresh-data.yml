name: Refresh market screener data

on:
  schedule:
    # 12:15 UTC = 5:45 PM IST — after NSE's bhavcopy is usually published.
    # GitHub's cron scheduler runs on a best-effort basis and can lag by
    # several minutes to occasionally longer at busy times; that's normal.
    - cron: "15 12 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests yfinance

      - name: Run screener
        run: python market_screener.py
        # No --date passed on purpose: the script auto-detects the most
        # recent trading day, so weekends/holidays don't break the run.

      - name: Commit updated data
        run: |
          git config user.name "market-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add screener_data.js
          git diff --quiet --cached || git commit -m "Refresh screener data"
          git push
